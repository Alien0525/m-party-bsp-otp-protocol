<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTPAC m=4 — individual-jump trace</title>
<style>
  :root{
    --p0:#2563eb; --p1:#16a34a; --p2:#ea580c; --p3:#9333ea;
    --bg:#0e1116; --panel:#161b22; --line:#2d333b; --ink:#e6edf3; --ink2:#9aa4b2;
    --used:#3b1d1d; --reuse:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  header{padding:12px 16px;border-bottom:1px solid var(--line)}
  h1{font-size:15px;margin:0 0 8px}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
  .fld{display:flex;flex-direction:column;gap:2px}
  .fld label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
  input,select,button{background:#0d1117;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}
  button{cursor:pointer;background:#1f6feb;border-color:#1f6feb}
  button:hover{background:#388bfd}
  main{display:grid;grid-template-columns:1fr 420px;gap:0;height:calc(100vh - 92px)}
  #left{overflow:auto;padding:12px 16px;border-right:1px solid var(--line)}
  #right{overflow:auto;padding:12px 16px}
  .p0{color:var(--p0)} .p1{color:var(--p1)} .p2{color:var(--p2)} .p3{color:var(--p3)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:4px}
  .b0{background:var(--p0)} .b1{background:var(--p1)} .b2{background:var(--p2)} .b3{background:var(--p3)}
  .status{margin:8px 0;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
  .status.reuse{border-color:var(--reuse);color:#ffb4b4}
  .status.clean{border-color:#2ea043;color:#9be7a6}
  /* pad strip */
  #strip{margin:10px 0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  #stripCanvas{display:block;width:100%;height:70px;background:#0b0e13}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0;font-size:11px;color:var(--ink2)}
  /* per-party views */
  .views{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .view{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:8px}
  .view h3{margin:0 0 6px;font-size:12px}
  .view .row{font-size:12px;padding:1px 0}
  .view .buf{color:var(--ink2)}
  .mut{color:var(--ink2)}
  /* log */
  .logtools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
  .logtools label{font-size:12px;color:var(--ink2);display:flex;gap:4px;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:3px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{position:sticky;top:0;background:var(--panel);z-index:1}
  tr.sel{background:#132132}
  tr.evReuse td{background:#3b1414;color:#ffb4b4}
  tr.evJump td{font-weight:700}
  tr:hover td{background:#0f1620;cursor:pointer}
  .pill{display:inline-block;padding:0 6px;border-radius:10px;font-size:10px;border:1px solid var(--line)}
  .scrub{display:flex;gap:8px;align-items:center;margin:6px 0}
  .scrub input[type=range]{flex:1}
  code{color:#d2a8ff}
</style>
</head>
<body>
<header>
  <h1>OTPAC m=4 · individual-jump · async trace</h1>
  <div class="controls">
    <div class="fld"><label>N (pad size)</label><input id="inN" type="number" value="256" min="16" style="width:90px"></div>
    <div class="fld"><label>d (buffer)</label><input id="inD" type="number" value="2" min="1" style="width:70px"></div>
    <div class="fld"><label>seed</label><input id="inSeed" type="number" value="81" style="width:80px"></div>
    <div class="fld"><label>delivery</label>
      <select id="inMode">
        <option value="instant">instant (synchronous)</option>
        <option value="worst" selected>worst (latest legal, FIFO)</option>
        <option value="random">random (≤d)</option>
        <option value="adversarial">adversarial</option>
        <option value="lifo">lifo (newest released first)</option>
        <option value="randcap">randcap (random msg released)</option>
        <option value="shuffle">shuffle (random early, random order)</option>
        <option value="target-sender">target-sender (one sender delayed)</option>
        <option value="target-recv">target-recv (one recipient delayed)</option>
      </select>
    </div>
    <div class="fld"><label>sender order</label>
      <select id="inPick">
        <option value="random" selected>random</option>
        <option value="rr">round-robin</option>
        <option value="flood">flood (P0 first)</option>
        <option value="flood-rev">flood-rev (P3 first)</option>
        <option value="skew">skew (one party 70%)</option>
        <option value="arena-skew">arena-skew (one arena 80%)</option>
        <option value="burst">burst (runs of up to 3d)</option>
        <option value="silent1">silent1 (one party never sends)</option>
        <option value="silent2">silent2 (two parties never send)</option>
        <option value="pair-alt">pair-alt (one pair, then the other)</option>
        <option value="greedy-gap">greedy-gap (closest-to-collision first)</option>
        <option value="stale-max">stale-max (most-undelivered first)</option>
      </select>
    </div>
    <div class="fld"><label>max steps</label><input id="inMax" type="number" value="20000" style="width:100px"></div>
    <button id="run">Run</button>
  </div>
</header>

<main>
  <div id="left">
    <div id="statusBox" class="status mut">Set inputs and press Run.</div>

    <div class="legend">
      <span><span class="dot b0"></span>P0 (→)</span>
      <span><span class="dot b1"></span>P1 (←)</span>
      <span><span class="dot b2"></span>P2 (→)</span>
      <span><span class="dot b3"></span>P3 (←)</span>
      <span><span class="dot" style="background:#3b1d1d"></span>used pad</span>
      <span><span class="dot" style="background:#ef4444"></span>reuse</span>
    </div>

    <div id="strip"><canvas id="stripCanvas" width="1200" height="70"></canvas></div>

    <div class="scrub">
      <span class="mut">step</span>
      <input id="scrub" type="range" min="0" max="0" value="0">
      <span id="scrubLbl" class="mut">0 / 0</span>
    </div>

    <div class="views" id="views"></div>
  </div>

  <div id="right">
    <div class="logtools">
      <strong>Log</strong>
      <label><input type="checkbox" class="fp" value="0" checked><span class="p0">P0</span></label>
      <label><input type="checkbox" class="fp" value="1" checked><span class="p1">P1</span></label>
      <label><input type="checkbox" class="fp" value="2" checked><span class="p2">P2</span></label>
      <label><input type="checkbox" class="fp" value="3" checked><span class="p3">P3</span></label>
      <span class="mut">|</span>
      <label><input type="checkbox" class="ft" value="WALK" checked>walk</label>
      <label><input type="checkbox" class="ft" value="JUMP" checked>jump</label>
      <label><input type="checkbox" class="ft" value="HALT" checked>halt</label>
      <label><input type="checkbox" class="ft" value="REUSE" checked>reuse</label>
    </div>
    <table id="logTable"><thead><tr>
      <th>#</th><th>actor</th><th>event</th><th>from→to</th><th>node</th><th>note</th>
    </tr></thead><tbody id="logBody"></tbody></table>
  </div>
</main>

<script>
"use strict";
// ======================= ENGINE (identical to otpac_m4.js) =======================
// ===========================================================================
// Asynchronous m=4 OTPAC simulator -- INDIVIDUAL-JUMP design.
//
// RULES:
//  1. Own Send / security: use pos+dir only if it is in NO reserved buffer and
//     not used; else jump; else halt.
//  2. Jump target = BSP node (M,M+1); right-mover -> M+1, left-mover -> M;
//     direction preserved; root-most not-fully-occupied node.
//  3. Jump validity: >2d free pads on BOTH sides measured OUTSIDE the node. On
//     the lander's back side (the partner slot's side), pads merely reserved for
//     parties moving the opposite way (away from the node) do not count;
//     positions and used pads always count.
//  4. Predictions are RECOMPUTED fresh on any occupancy change (walk-predicted
//     pads are additionally held, Rule 9).
//  5. Reservations are DISJOINT: a pad reserved for one party is not reserved
//     for another (prediction treats others' buffers as obstacles too).
//  6. Speculative-jumpspot invalidation: a jumpspot is produced only while it
//     passes Rule 3; an approaching party that breaks its clearance (with no
//     confirmed jump) makes the next recompute drop it.
//  7. On every Receive, re-validate ALL tracked parties' buffers, not just the
//     sender's.
//  8. Message order (header carries a per-sender message #):
//     (a) an OLDER message only marks its pad used -- it never moves the
//         sender's believed position backward;
//     (b) a NEWER message that skips k numbers means the sender used k pads on
//         the way; those pads are marked occupied, carefully around jumps:
//         only the reservation if the sender provably followed it, only the
//         straight-line pads if it provably walked, and for an unforeseen jump
//         every pad it could have used (see assumeSkipped).
//  9. Sticky reservations: a WALK-predicted pad stays reserved until all of the
//     party's messages up to the one it was predicted for have arrived (then it
//     is either known used or proven unused). Jump-predicted pads follow Rule 6.
// ===========================================================================

function bspNodes(n){                      // static BSP center-pad pairs, root-first
  const out=[]; const q=[[1,n]];
  while(q.length){const [L,R]=q.shift();const M=(L+R)>>1;
    if(M>L&&M<R){out.push(M);if(R-L>=2){q.push([L,M-1]);q.push([M+1,R]);}}}
  return out;
}

function initWorld(n,d,m){
  m=m||4; const parties=[]; const arenas=m/2, aw=Math.floor(n/arenas);
  for(let a=0;a<arenas;a++){
    const L=a*aw+1, R=(a===arenas-1)?n:(a+1)*aw;
    parties.push({id:2*a,   pos:L, dir:+1, halted:false, sent:0});
    parties.push({id:2*a+1, pos:R, dir:-1, halted:false, sent:0});
  }
  return {n,d,m,parties,used:new Map(),nodes:bspNodes(n)};
}

// Options (both ON by default; switchable for comparison runs):
//   sticky    -- Rule 9: walk-predicted reservations are held until proven resolved
//   oppExempt -- Rule 3 refinement: on the lander's back side, pads merely reserved for
//                parties moving the opposite way (away from the node) are not obstacles
const OPT={sticky:true, oppExempt:true, stickyJumps:false};   // stickyJumps: comparison only -- also hold jump-predicted pads (i.e. no Rule 6)
function setOptions(o){ Object.assign(OPT,o); }

// --- OWN-MOVE occupancy: what a sender must NOT write. Union of used pads,
// every tracked party's confirmed position, and every tracked party's reserved
// buffer (all of them = the security check), plus the sender's own position.
// resDir: pad -> direction of the party it is reserved for, only for pads that are
// blocked SOLELY by a reservation (not used, not anyone's position).
function occupancy(view){
  const blocked=new Set(), owner=new Map(), hard=new Set(), resDir=new Map();
  for(const [id,o] of view.others){
    if(typeof id!=="number") { for(const b of o.buf) blocked.add(b); continue; }
    blocked.add(o.pos); hard.add(o.pos); owner.set(o.pos,id);
    for(const b of o.buf){ blocked.add(b); if(!owner.has(b)) owner.set(b,id); if(!resDir.has(b)) resDir.set(b,o.dir); }
  }
  blocked.add(view.self.pos); hard.add(view.self.pos);
  if(view.used) for(const u of view.used){ blocked.add(u); hard.add(u); if(!owner.has(u)) owner.set(u,'used'); }
  for(const h of hard) resDir.delete(h);
  return {blocked,owner,resDir};
}

// --- reservedBy: pads reserved (undelivered) for SOME OTHER party in this view,
// used by the driver's badWrite assertion (a sender must never pick one).
function buildBlocked(view,n){
  const reservedBy=new Map();
  for(const [id,o] of view.others){
    if(typeof id!=="number") continue;
    for(const b of o.buf){ if(!reservedBy.has(b)) reservedBy.set(b,id); }
  }
  return {reservedBy};
}

// --- PREDICTION occupancy for party K. Obstacles are: used pads, every OTHER
// tracked party's confirmed position, the observer's own position, AND every
// OTHER party's reserved buffer -- so a pad already reserved for another party
// is NOT reserved again for K (reservations are DISJOINT). `extra` = pads already
// placed in K's own buffer this pass. Returns {blocked, resDir} (see occupancy).
function predBlocked(view,k,extra){
  const blocked=new Set(), hard=new Set(), resDir=new Map();
  if(view.used) for(const u of view.used){ blocked.add(u); hard.add(u); }
  for(const [id,o] of view.others){
    if(id===k||typeof id!=="number") continue;
    blocked.add(o.pos); hard.add(o.pos);
    for(const b of o.buf){ blocked.add(b); if(!resDir.has(b)) resDir.set(b,o.dir); }   // disjoint reservations
  }
  blocked.add(view.self.pos); hard.add(view.self.pos);
  if(extra) for(const e of extra){ blocked.add(e); hard.add(e); }
  for(const h of hard) resDir.delete(h);
  return {blocked,resDir};
}

// --- root-most not-fully-occupied node, default side by dir, >2d clearance
// measured OUTSIDE the node's own two pads.
//   FRONT side (the side the lander travels toward): every obstacle counts.
//   BACK side (where the node's partner slot is): pads merely RESERVED for parties
//     moving the OPPOSITE way -- i.e. away from this node -- do not count (e.g. a
//     right-mover predicted to land on the partner slot M+1 and walk right does not
//     invalidate M for a left-mover). Positions and used pads always count.
// A jumpspot is VALID only while this returns it; when an approaching party
// breaks the clearance it returns a different node or null (Rule 6).
function jumpTarget(dir,blocked,n,d,nodes,resDir){
  for(const M of nodes){
    const left=M,right=M+1; if(right>n) continue;
    if(blocked.has(left)&&blocked.has(right)) continue;   // fully occupied -> descend
    const cand = dir===+1 ? right : left;
    if(blocked.has(cand)) continue;                       // my slot taken -> descend
    const front = dir===+1 ? clearOutside(right,+1,blocked,n) : clearOutside(left,-1,blocked,n);
    const back = (OPT.oppExempt && resDir)
      ? (dir===+1 ? clearOutsideExempt(left,-1,blocked,n,resDir,-dir) : clearOutsideExempt(right,+1,blocked,n,resDir,-dir))
      : (dir===+1 ? clearOutside(left,-1,blocked,n) : clearOutside(right,+1,blocked,n));
    if(front > 2*d && back > 2*d) return cand;
  }
  return null;                                            // no valid node -> halt
}
function clearOutside(edge,step,blocked,n){let c=0,q=edge+step;while(q>=1&&q<=n&&!blocked.has(q)){c++;q+=step;}return c;}
// as clearOutside, but a pad reserved for a party moving in `awayDir` is treated as free
function clearOutsideExempt(edge,step,blocked,n,resDir,awayDir){let c=0,q=edge+step;while(q>=1&&q<=n&&(!blocked.has(q)||resDir.get(q)===awayDir)){c++;q+=step;}return c;}
function clearance(p,step,blocked,n){let c=0,q=p+step;while(q>=1&&q<=n&&!blocked.has(q)){c++;q+=step;}return c;}

// --- one step of a path: WALK if next linear pad free of `blocked`, else JUMP
// to the root-most VALID node. Returns {pad, jumped, face} or null (halt).
function stepOf(pos,dir,blocked,n,d,nodes,resDir){
  const lin=pos+dir;
  if(lin>=1 && lin<=n && !blocked.has(lin)) return {pad:lin,jumped:false,face:dir};  // walk
  const t=jumpTarget(dir,blocked,n,d,nodes,resDir);                                   // overlap -> jump
  if(t==null) return null;
  return {pad:t,jumped:true,face:dir};
}

// Public: a party's OWN next move, from its view (union-of-buffers occupancy).
function nextSlot(pos,dir,view,n,d,nodes){
  const {blocked,resDir}=occupancy(view);
  return stepOf(pos,dir,blocked,n,d,nodes,resDir);
}

// --- K's reserved buffer = FRESH prediction + HELD (sticky) pads.
//   fwd: K's next d pads from K's confirmed position, jump-aware, recomputed on
//        every occupancy change. Jump-predicted pads (a landing and the walk after
//        it) live only here, so an invalidated jumpspot drops (Rule 6).
//   held (Rule 9): every WALK-predicted pad (those before the first predicted jump)
//        is also remembered with the message # it was predicted for, and stays
//        reserved until all of K's messages up to that # have arrived (then the pad
//        is either known used, or proven unused). See deliverBuffer.
function refreshBuffer(observerView,k,n,d,nodes){
  const ko=observerView.others.get(k);
  if(!ko) return;
  let p=ko.pos, dir=ko.dir;
  const fwd=[]; let firstJump=-1;
  for(let s=0;s<d;s++){
    const {blocked,resDir}=predBlocked(observerView,k,fwd);
    const st=stepOf(p,dir,blocked,n,d,nodes,resDir);
    if(!st) break;                       // K would halt here -> predict nothing further
    if(st.jumped && firstJump<0) firstJump=fwd.length;
    fwd.push(st.pad);
    p=st.pad; if(st.jumped) dir=st.face;
  }
  ko.fwd=fwd;
  const buf=fwd.slice();
  if(OPT.sticky){
    const held=ko.held||(ko.held=new Map());          // pad -> message # it was predicted for
    const last=ko.lastNum||0, lin=(OPT.stickyJumps||firstJump<0)?fwd.length:firstJump;
    for(let i=0;i<lin;i++){ const q=fwd[i], s=last+1+i; if(!(held.get(q)>=s)) held.set(q,s); }
    const used=observerView.used;
    for(const [q] of held){ if(used&&used.has(q)) held.delete(q); else if(!buf.includes(q)) buf.push(q); }
  }
  ko.buf=buf;
}

// --- RECEIVE: observer hears party `fromId` used pad `pad` moving `dir`, in
// that party's message number `num` (header = sender, pad, message #).
//
//   OLDER message (num <= highest # already received from this sender):
//     only mark `pad` as used. The believed position/direction do NOT move
//     (an older message must never move a party backward).
//   NEWER message that skips k numbers (num = last + 1 + k):
//     the party must have used k pads to get here, so the first k pads of the
//     current reservation for it are ASSUMED OCCUPIED (marked used). Then the
//     believed position/direction move to `pad`.
//
// Then RE-VALIDATE EVERY tracked party's buffer, because this move may have
// invalidated another party's speculative jumpspot or freed pads it can now
// reserve. (If `num` is omitted, falls back to the old behaviour: always move.)
function deliverBuffer(observerView,fromId,pad,dir,n,d,nodes,num){
  const o=observerView.others.get(fromId);
  if(!o) return;
  if(observerView.used) observerView.used.add(pad);
  const last=o.lastNum||0;
  const recv=o.recv||(o.recv=new Set());
  if(num===undefined || num>last){
    if(num!==undefined){
      const k=num-last-1;                                    // messages skipped
      if(k>0){
        // Rule 8(b) marks every pad the skipped messages could have used; if that
        // accounting is complete, the skipped numbers count as resolved (Rule 9).
        const accounted=assumeSkipped(observerView,o,pad,k,n);
        if(accounted) for(let c=last+1;c<num;c++) recv.add(c);
      }
      o.lastNum=num;
    }
    o.pos=pad; if(dir!==undefined) o.dir=dir;
  }
  if(num!==undefined){
    // Rule 9: once messages 1..prefix are all received or accounted for, every held
    // pad predicted for a message # <= prefix is resolved (known used, or proven unused).
    recv.add(num);
    o.prefix=o.prefix||0; while(recv.has(o.prefix+1)) o.prefix++;
    if(o.held) for(const [q,s] of o.held) if(s<=o.prefix) o.held.delete(q);
  }
  // else: older message -> pad is marked used above; position stays where it is
  for(const [id] of observerView.others){ if(typeof id==="number") refreshBuffer(observerView,id,n,d,nodes); }
}

// --- Rule 8(b): party K sent k messages we have not received between its last
// confirmed pad (o.pos) and `pad`. Mark as occupied the pads K used for them.
// K's direction never changes (direction is preserved across jumps).
//  (i)  PREDICTED: `pad` is the (k+1)-th pad of our current reservation for K, so K
//       followed the predicted path (walks and any predicted jump) -> the first k
//       reserved pads are certain.
//  (ii) STRAIGHT WALK: pad = o.pos + (k+1)*dir. A jump can never land there (a
//       landing needs >2d free pads around it), so K walked -> the k pads between
//       are certain, whatever the reservation said.
//  (iii) UNFORESEEN JUMP: K walked j pads (0<=j<=k), jumped, then walked into `pad`;
//       j is unknown, so which pads K used is unknown. Policy (SKIP_JUMP_POLICY):
//         "both"   (default) mark every pad K could have used: the k pads right
//                  after o.pos and the k pads right before `pad` (<= k extra pads);
//         "guided" guess j from our reservation's walk prefix (pads it predicted K
//                  would walk before jumping) and mark only that guess;
//         "none"   mark nothing.
let SKIP_JUMP_POLICY="both";
function setSkipJumpPolicy(p){ SKIP_JUMP_POLICY=p; }
function assumeSkipped(view,o,pad,k,n){
  const dir=o.dir, marks=[]; let kase; const pred=o.fwd||o.buf;   // the fresh prediction, in order
  if(pred.length>k && pred[k]===pad){ kase="predicted"; for(let i=0;i<k;i++) marks.push(pred[i]); }
  else if(pad===o.pos+(k+1)*dir){ kase="straight"; for(let i=1;i<=k;i++) marks.push(o.pos+i*dir); }
  else {
    kase="jump";
    if(SKIP_JUMP_POLICY==="both"){ for(let i=1;i<=k;i++){ marks.push(o.pos+i*dir); marks.push(pad-i*dir); } }
    else if(SKIP_JUMP_POLICY==="guided"){
      let j=0; while(j<k && j<pred.length && pred[j]===o.pos+(j+1)*dir) j++;     // predicted walks before the jump
      for(let i=1;i<=j;i++) marks.push(o.pos+i*dir);                          // pre-jump walks
      for(let i=1;i<=k-j;i++) marks.push(pad-i*dir);                           // landing + walks after it
    }
  }
  for(const q of marks){
    if(q<1||q>n) continue;
    if(view.used) view.used.add(q);
    (o.assumed=o.assumed||[]).push(q);                        // for display
    (o.assumedLog=o.assumedLog||[]).push({pad:q,kase});       // for test statistics
  }
  // complete accounting: the path is certain, or every possible pad was marked
  return kase!=="jump" || SKIP_JUMP_POLICY==="both";
}

// ======================= DRIVER (matches finalcap.js exactly) =======================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// Driver = identical logic (and RNG call order) to otpac_test_suite.js, so any
// case from the suite (n,d,seed,mode,schedule) replays here exactly.
// Delivery modes (all keep <= d undelivered per recipient):
//   instant, worst, random, adversarial, lifo, randcap, shuffle, target-sender, target-recv
// Sender schedules: random, rr, flood, flood-rev, skew, arena-skew, burst,
//   silent1, silent2, pair-alt, greedy-gap, stale-max
// HALT-ON-REUSE: if a party is about to use an already-used pad, the whole
// protocol halts before that send; all unused pads count as wasted.
function simulate(n,d,seed,mode,pick,maxSteps){
  const sched=pick;
  const w=initWorld(n,d,4);const rng=mulberry32(seed);
  const aux=mulberry32(((seed*2654435761)>>>0) ^ 0x5bd1e995);
  const ids=w.parties.map(p=>p.id);const P=id=>w.parties.find(p=>p.id===id);
  const targetParty=ids[Math.floor(aux()*4)], fav=ids[Math.floor(aux()*4)], favArena=Math.floor(aux()*2);
  const sil1=ids[Math.floor(aux()*4)], sil2=ids[(ids.indexOf(sil1)+1+Math.floor(aux()*3))%4];
  const silent=new Set(sched==="silent1"?[sil1]:sched==="silent2"?[sil1,sil2]:[]);
  const firstPair=Math.floor(aux()*2);
  const sent={0:[],1:[],2:[],3:[]};const heard={};
  for(const o of w.parties){heard[o.id]={};for(const k of w.parties)if(k.id!==o.id)heard[o.id][k.id]=0;}
  const views=new Map();
  for(const me of w.parties){const others=new Map();for(const k of w.parties)if(k.id!==me.id)others.set(k.id,{pos:k.pos,dir:k.dir,buf:[]});
    const v={self:{pos:me.pos,dir:me.dir},others,used:new Set()};
    for(const k of w.parties)if(k.id!==me.id)refreshBuffer(v,k.id,n,d,w.nodes);views.set(me.id,v);}
  const inflight=[];let g=0;
  function applyRecv(rid,m){const v=views.get(rid),o=v.others.get(m.from);if(!o)return;deliverBuffer(v,m.from,m.pad,m.dir,n,d,w.nodes,m.sseq);heard[rid][m.from]++;}
  function removeSet(del){if(!del.size)return;const keep=inflight.filter(m=>!del.has(m));inflight.length=0;inflight.push(...keep);}
  function deliverBefore(rid){
    if(mode==="random"||mode==="adversarial"){const pe=mode==="random"?0.5:0.1;const del=new Set();
      for(const m of inflight.filter(m=>m.to===rid)){if(rng()<pe){applyRecv(rid,m);del.add(m);}}removeSet(del);}
    else if(mode==="shuffle"){const mine=inflight.filter(m=>m.to===rid);
      for(let i=mine.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[mine[i],mine[j]]=[mine[j],mine[i]];}
      const del=new Set();for(const m of mine){if(rng()<0.3){applyRecv(rid,m);del.add(m);}}removeSet(del);}
  }
  function deliverAfterSend(){
    if(mode==="instant"){const all=inflight.slice();for(const m of all)applyRecv(m.to,m);inflight.length=0;return;}
    if(mode==="target-sender"){const del=new Set();for(const m of inflight)if(m.from!==targetParty){applyRecv(m.to,m);del.add(m);}removeSet(del);return;}
    if(mode==="target-recv"){const del=new Set();for(const m of inflight)if(m.to!==targetParty){applyRecv(m.to,m);del.add(m);}removeSet(del);return;}
  }
  const capPolicy=(mode==="lifo"||mode==="target-sender"||mode==="target-recv")?"newest":(mode==="randcap"||mode==="shuffle")?"random":"oldest";
  function capQueues(){for(const r of w.parties){let mine=inflight.filter(m=>m.to===r.id);let ex=mine.length-d;if(ex<=0)continue;const del=new Set();
    if(capPolicy==="oldest"){mine.sort((a,b)=>a.gseq-b.gseq);for(let i=0;i<ex;i++){applyRecv(r.id,mine[i]);del.add(mine[i]);}}
    else if(capPolicy==="newest"){mine.sort((a,b)=>b.gseq-a.gseq);for(let i=0;i<ex;i++){applyRecv(r.id,mine[i]);del.add(mine[i]);}}
    else{while(ex>0){const cand=mine.filter(m=>!del.has(m));const m=cand[Math.floor(rng()*cand.length)];applyRecv(r.id,m);del.add(m);ex--;}}
    removeSet(del);}}
  let burstParty=null,burstLeft=0,pairTurn=0;
  function pickNext(steps){
    const live=w.parties.filter(p=>!p.halted&&!silent.has(p.id));if(!live.length)return null;
    const uni=()=>live[Math.floor(rng()*live.length)];
    switch(sched){
      case "random":return uni();
      case "rr":return live[steps%live.length];
      case "flood":return live[0];
      case "flood-rev":return live[live.length-1];
      case "skew":{const f=live.find(p=>p.id===fav);return(f&&rng()<0.7)?f:uni();}
      case "arena-skew":{const inA=live.filter(p=>Math.floor(p.id/2)===favArena),out=live.filter(p=>Math.floor(p.id/2)!==favArena);
        if(inA.length&&(rng()<0.8||!out.length))return inA[Math.floor(rng()*inA.length)];return out.length?out[Math.floor(rng()*out.length)]:uni();}
      case "burst":{if(burstParty&&!burstParty.halted&&burstLeft>0){burstLeft--;return burstParty;}burstParty=uni();burstLeft=Math.floor(rng()*3*d);return burstParty;}
      case "silent1":case "silent2":return uni();
      case "pair-alt":{const pairs=firstPair===0?[[0,1],[2,3]]:[[2,3],[0,1]];
        for(const pr of pairs){const lp=pr.map(P).filter(p=>!p.halted&&!silent.has(p.id));if(lp.length){pairTurn++;return lp[pairTurn%lp.length];}}return uni();}
      case "greedy-gap":{let best=[],bestGap=Infinity;
        for(const p of live){let gap=p.dir>0?(n-p.pos):(p.pos-1);for(const q of w.parties){if(q===p)continue;const s=(q.pos-p.pos)*p.dir;if(s>0&&s<gap)gap=s;}
          if(gap<bestGap){bestGap=gap;best=[p];}else if(gap===bestGap)best.push(p);}
        return best[Math.floor(rng()*best.length)];}
      case "stale-max":{const cnt={};for(const p of live)cnt[p.id]=0;for(const m of inflight)if(cnt[m.from]!==undefined)cnt[m.from]++;
        let mx=-1,best=[];for(const p of live){if(cnt[p.id]>mx){mx=cnt[p.id];best=[p];}else if(cnt[p.id]===mx)best.push(p);}
        return best[Math.floor(rng()*best.length)];}
      default:return uni();
    }
  }
  const roles={target:(mode==="target-sender"||mode==="target-recv")?targetParty:null,silent:[...silent]};

  const events=[];
  function snapshot(){
    const positions={};for(const p of w.parties)positions[p.id]={pos:p.pos,dir:p.dir,halted:p.halted};
    const vv={};for(const o of w.parties){vv[o.id]={};for(const [k,ov] of views.get(o.id).others)vv[o.id][k]={pos:ov.pos,dir:ov.dir,buf:ov.buf.slice(),fwd:(ov.fwd||ov.buf).slice(),held:ov.buf.filter(x=>!(ov.fwd||ov.buf).includes(x)),assumed:(ov.assumed||[]).slice(-4)};}
    const stale={};for(const o of w.parties){stale[o.id]={};for(const k of w.parties)if(k.id!==o.id)stale[o.id][k.id]=sent[k.id].length-heard[o.id][k.id];}
    const usedArr=[...w.used];   // [[pad,owner],...]
    return {positions,views:vv,stale,used:w.used.size,usedArr};
  }
  let steps=0,reuse=null;
  events.push({step:0,type:"INIT",actor:-1,note:"initial",snap:snapshot()});
  while(steps<maxSteps){
    const me=pickNext(steps);if(!me)break;
    const prev=me.pos,pdir=me.dir;
    deliverBefore(me.id);
    const v=views.get(me.id);v.self.pos=me.pos;v.self.dir=me.dir;
    const nx=nextSlot(me.pos,me.dir,v,n,d,w.nodes);steps++;
    if(!nx){me.halted=true;events.push({step:steps,type:"HALT",actor:me.id,from:prev,to:prev,note:"no legal jumpspot",snap:snapshot()});continue;}
    if(w.used.has(nx.pad)){reuse={pad:nx.pad,first:w.used.get(nx.pad),second:me.id,step:steps,wasted:n-w.used.size};
      events.push({step:steps,type:"REUSE",actor:me.id,from:prev,to:nx.pad,jumped:nx.jumped,node:nx.jumped?(pdir>0?nx.pad-1:nx.pad):null,
        note:`would reuse pad ${nx.pad} (used by P${w.used.get(nx.pad)}) -> protocol HALTED, ${n-w.used.size} pads wasted`,snap:snapshot()});break;}
    me.pos=nx.pad;if(nx.jumped)me.dir=nx.face;me.sent++;
    w.used.set(nx.pad,me.id);g++;v.used.add(nx.pad);sent[me.id].push(nx.pad);
    for(const k of w.parties)if(k.id!==me.id)inflight.push({to:k.id,from:me.id,pad:nx.pad,dir:me.dir,gseq:g,sseq:me.sent});
    deliverAfterSend();
    capQueues();
    events.push({step:steps,type:nx.jumped?"JUMP":"WALK",actor:me.id,from:prev,to:nx.pad,
      node:nx.jumped?(pdir>0?nx.pad-1:nx.pad):null,note:nx.jumped?`node (${(pdir>0?nx.pad-1:nx.pad)},${(pdir>0?nx.pad-1:nx.pad)+1})`:"",snap:snapshot()});
  }
  // verify invariant
  let invViol=null;
  for(const e of events){const s=e.snap;for(const oid in s.stale)for(const kid in s.stale[oid])if(s.stale[oid][kid]>d){invViol={oid,kid,val:s.stale[oid][kid],step:e.step};break;}}
  return {n,d,seed,mode,pick,events,reuse,invViol,usedTotal:w.used.size,eff:w.used.size/n,roles};
}

// ======================= UI =======================
let RUN=null, SEL=0;
const $=id=>document.getElementById(id);
function classP(id){return "p"+id;}

function run(){
  const n=+$("inN").value,d=+$("inD").value,seed=+$("inSeed").value,mode=$("inMode").value,pick=$("inPick").value,max=+$("inMax").value;
  RUN=simulate(n,d,seed,mode,pick,max);
  SEL=RUN.events.length-1;
  RUN.reusePad = RUN.reuse ? RUN.reuse.pad : null;
  // status
  const sb=$("statusBox");
  const rolesTxt=(RUN.roles&&RUN.roles.target!=null?` · delayed party: P${RUN.roles.target}`:"")+(RUN.roles&&RUN.roles.silent.length?` · silent: ${RUN.roles.silent.map(p=>"P"+p).join(", ")}`:"");
  const effTxt=`efficiency <strong>${(RUN.eff*100).toFixed(2)}%</strong> (${RUN.usedTotal}/${n} pads used, ${n-RUN.usedTotal} wasted)`;
  if(RUN.reuse){sb.className="status reuse";
    sb.innerHTML=`<strong>HALTED at would-be reuse</strong> (step ${RUN.reuse.step}): <span class="${classP(RUN.reuse.second)}">P${RUN.reuse.second}</span> was about to use pad <code>${RUN.reuse.pad}</code>, already used by <span class="${classP(RUN.reuse.first)}">P${RUN.reuse.first}</span>. Protocol stopped; all unused pads wasted → ${effTxt}${rolesTxt}. `
      +(RUN.invViol?`<span style="color:#ffd479">⚠ invariant violated (P${RUN.invViol.oid} was ${RUN.invViol.val}&gt;d behind P${RUN.invViol.kid})</span>`:`Delivery invariant ≤ d held throughout.`);
  } else {sb.className="status clean";
    sb.innerHTML=`No reuse. ${effTxt}${rolesTxt}. ${RUN.events.length} events. Invariant ≤ d: ${RUN.invViol?'VIOLATED':'held'}.`;}
  // scrub
  const sc=$("scrub");sc.max=RUN.events.length-1;sc.value=SEL;
  renderLog();renderStep();
}

function passFilter(e){
  const fp=[...document.querySelectorAll('.fp:checked')].map(c=>c.value);
  const ft=[...document.querySelectorAll('.ft:checked')].map(c=>c.value);
  if(e.type==="INIT")return true;
  if(e.actor>=0 && !fp.includes(String(e.actor)))return false;
  if(!ft.includes(e.type))return false;
  return true;
}
function renderLog(){
  const body=$("logBody");body.innerHTML="";
  RUN.events.forEach((e,i)=>{
    if(!passFilter(e))return;
    const tr=document.createElement("tr");
    tr.className=(i===SEL?"sel ":"")+(e.type==="REUSE"?"evReuse ":"")+(e.type==="JUMP"?"evJump ":"");
    const ft=e.from!==undefined?`${e.from}${e.actor>=0&&RUN.events[i].snap.positions[e.actor]?'':''}→${e.to}`:"";
    tr.innerHTML=`<td>${e.step}</td>`
      +`<td class="${e.actor>=0?classP(e.actor):'mut'}">${e.actor>=0?'P'+e.actor:'—'}</td>`
      +`<td>${e.type}</td>`
      +`<td>${e.from!==undefined?e.from+'→'+e.to:''}</td>`
      +`<td>${e.node!=null?'('+e.node+','+(e.node+1)+')':''}</td>`
      +`<td class="mut">${e.note||''}</td>`;
    tr.onclick=()=>{SEL=i;$("scrub").value=i;renderLog();renderStep();};
    body.appendChild(tr);
  });
}

function dirArrow(dir){return dir>0?'→':'←';}
function renderViews(snap){
  const box=$("views");box.innerHTML="";
  for(const oid of [0,1,2,3]){
    const v=snap.views[oid];const me=snap.positions[oid];
    const div=document.createElement("div");div.className="view";
    let html=`<h3 class="${classP(oid)}"><span class="dot b${oid}"></span>P${oid} @ ${me.pos}${dirArrow(me.dir)}${me.halted?' <span class="mut">(halted)</span>':''}</h3>`;
    for(const k of [0,1,2,3]){ if(k==oid)continue; const o=v[k]; const st=snap.stale[oid][k];
      html+=`<div class="row"><span class="${classP(k)}">P${k}</span>: believes @${o.pos}${dirArrow(o.dir)} `
        +`<span class="buf">reserved[${(o.fwd||o.buf).join(', ')}]</span> `
        +(o.held&&o.held.length?`<span class="buf" title="walk-predicted pads still held until the party's messages up to them arrive (Rule 9)">held[${o.held.join(', ')}]</span> `:'')
        +(o.assumed&&o.assumed.length?`<span class="buf" title="pads assumed occupied because a newer message skipped them (Rule 8b)">assumed used[${o.assumed.join(', ')}]</span> `:'')
        +`<span class="mut">· ${st} behind</span></div>`;
    }
    div.innerHTML=html;box.appendChild(div);
  }
}

function renderStrip(snap){
  const c=$("stripCanvas"),ctx=c.getContext("2d");const n=RUN.n;
  const W=c.width,H=c.height;ctx.clearRect(0,0,W,H);
  const x=p=>Math.round((p-1)/(n-1)*(W-8))+4;
  const cols=["#2563eb","#16a34a","#ea580c","#9333ea"];
  // consumed pads (history), colored faintly by owner
  if(snap.usedArr){for(const [pad,owner] of snap.usedArr){const c=(owner==='used'||typeof owner!=='number')?"#888":cols[owner];
    ctx.fillStyle=c+"44";ctx.fillRect(x(pad),H/2+8,Math.max(1,(W-8)/(n-1)),8);}}
  // baseline
  ctx.strokeStyle="#2d333b";ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();
  // reserved buffers (thin ticks) per owner, faint, above the line
  for(const oid of [0,1,2,3]){const v=snap.views[oid];for(const k in v){const o=v[k];ctx.fillStyle=cols[k]+"55";
    for(const b of o.buf){ctx.fillRect(x(b)-1,H/2-8,2,16);}}}
  // reuse marker: bright red X at the reused pad
  if(RUN.reusePad!=null){const px=x(RUN.reusePad);ctx.strokeStyle="#ef4444";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(px-6,H/2-12);ctx.lineTo(px+6,H/2+12);ctx.moveTo(px+6,H/2-12);ctx.lineTo(px-6,H/2+12);ctx.stroke();ctx.lineWidth=1;
    ctx.fillStyle="#ef4444";ctx.font="9px monospace";ctx.fillText("reuse "+RUN.reusePad,px-16,H/2-16);}
  // true positions (solid)
  for(const id of [0,1,2,3]){const p=snap.positions[id];ctx.fillStyle=cols[id];
    const px=x(p.pos);ctx.beginPath();ctx.arc(px,H/2,6,0,7);ctx.fill();
    ctx.fillStyle="#fff";ctx.font="9px monospace";ctx.fillText("P"+id,px-6,H/2-10);
    ctx.fillStyle=cols[id];ctx.font="9px monospace";ctx.fillText(p.pos+(p.dir>0?"→":"←"),px-10,H/2+18);}
}

function renderStep(){
  const e=RUN.events[SEL];const snap=e.snap;
  $("scrubLbl").textContent=`${SEL} / ${RUN.events.length-1}  (step ${e.step}${e.actor>=0?', P'+e.actor+' '+e.type:''})`;
  renderViews(snap);renderStrip(snap);
}

$("run").onclick=run;
$("scrub").oninput=e=>{SEL=+e.target.value;renderLog();renderStep();};
document.querySelectorAll('.fp,.ft').forEach(c=>c.onchange=renderLog);
// autorun with defaults (reproduces the reuse)
run();
</script>
</body>
</html>
